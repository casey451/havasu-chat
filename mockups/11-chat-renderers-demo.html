<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hava — chat component renderers (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>/* app/static/styles/chat.css
 *
 * Hava — new /chat surface (BUILD.md step 5).
 * Mobile-first. Sticky composer at the bottom. Renders chat turns with
 * Hava's voice + a component payload (day_agenda, week_strip, card_row,
 * single_card, single_business_card, business_list, or none).
 *
 * Source mockup: mockups/04-answer-rendering.html (events) and
 * mockups/07-business-answer.html (businesses).
 */

:root {
  --bg: #f7f5ef;
  --bg-2: #f1eee5;
  --paper: #ffffff;

  --ink: #14140f;
  --ink-2: #4a4a44;
  --ink-3: #6e6e67;
  --ink-4: #a8a89f;

  --rule: rgba(20, 20, 15, 0.10);
  --rule-soft: rgba(20, 20, 15, 0.06);
  --rule-hair: rgba(20, 20, 15, 0.04);

  --accent-50: #e8f1f3;
  --accent-100: #c6dde2;
  --accent-soft: rgba(14, 110, 124, 0.08);
  --accent: #0e6e7c;
  --accent-deep: #064551;

  --warm: #b8623d;
  --warm-soft: rgba(184, 98, 61, 0.10);

  --open: #5a8a4f;
  --open-soft: rgba(90, 138, 79, 0.10);

  --live: #e8654a;

  --sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --serif: "Fraunces", "Source Serif 4", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
  font-feature-settings: "ss01", "cv01", "cv11";
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-deep); }
img { display: block; max-width: 100%; }

.page {
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 16px 120px; /* bottom padding leaves room for sticky composer */
  min-height: 100dvh;
}

/* ─────────── topbar (matches /home) ─────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 24px;
}
.wordmark {
  display: flex; align-items: center; gap: 11px;
  font-weight: 500; font-size: 17px; letter-spacing: -0.012em;
  color: var(--ink);
  text-decoration: none;
}
.wordmark .mark {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1797a8 0%, #0e6e7c 55%, #064551 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}
.topbar-meta {
  font-size: 13px;
  color: var(--ink-3);
  display: flex; align-items: center; gap: 14px;
}
.topbar-meta a { color: var(--ink-2); }
.topbar-meta a:hover { color: var(--ink); }

/* ─────────── chat thread ─────────── */
.thread {
  display: flex; flex-direction: column;
  gap: 8px;
  padding-top: 8px;
}

.turn-user {
  display: flex; justify-content: flex-end;
  margin-top: 18px;
}
.turn-user .bubble {
  background: var(--warm-soft);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 18px 18px 4px 18px;
  font-size: 15px;
  max-width: 80%;
  border: 1px solid rgba(184, 98, 61, 0.14);
  white-space: pre-wrap;
  word-wrap: break-word;
}

.turn-hava {
  display: flex; gap: 12px; align-items: flex-start;
  margin-top: 6px;
}
.turn-hava .avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1797a8 0%, #0e6e7c 55%, #064551 100%);
  flex-shrink: 0;
  margin-top: 4px;
}
.turn-hava .said { flex: 1; min-width: 0; }
.turn-hava .voice {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.4;
  color: var(--ink);
  margin: 0;
  font-weight: 400;
  letter-spacing: -0.012em;
  font-variation-settings: "opsz" 60;
}
.turn-hava .voice em { font-style: italic; color: var(--accent-deep); }
.turn-hava .voice a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
.turn-hava .component-slot {
  margin-top: 12px;
}

/* loading state — Hava is typing */
.turn-hava.is-loading .voice {
  color: var(--ink-3);
  font-style: italic;
}
.typing-dots {
  display: inline-flex; gap: 4px; align-items: center;
  height: 1em;
}
.typing-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
  animation: typing 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.30s; }
@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}
@media (prefers-reduced-motion: reduce) {
  .typing-dots span { animation: none; opacity: 0.6; }
}

/* error state */
.turn-hava.is-error .voice {
  color: var(--warm);
}

/* ─────────── empty state ─────────── */
.empty-state {
  text-align: center;
  padding: 48px 16px 24px;
  max-width: 520px;
  margin: 0 auto;
}
.empty-state .eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--ink-3);
  font-weight: 500;
  margin: 0 0 14px;
}
.empty-state h1 {
  font-family: var(--serif);
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 300;
  margin: 0 0 12px;
  font-variation-settings: "opsz" 144;
}
.empty-state h1 em { font-style: italic; color: var(--accent-deep); }
.empty-state p {
  font-size: 15px;
  color: var(--ink-2);
  margin: 0;
}

/* chips row in empty state */
.chips {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 6px; max-width: 540px;
  margin: 22px auto 0;
}
.chip {
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  font-family: inherit;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.chip:hover {
  color: var(--ink);
  border-color: rgba(20, 20, 15, 0.22);
  background: var(--paper);
}

/* ─────────── day_agenda component ─────────── */
.agenda {
  background: var(--paper);
  border: 1px solid var(--rule-hair);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(20, 20, 15, 0.03), 0 12px 28px -20px rgba(20, 20, 15, 0.10);
}
.agenda-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule-soft);
  display: flex; align-items: baseline; justify-content: space-between;
  background: linear-gradient(180deg, rgba(247, 245, 239, 0.5) 0%, transparent 100%);
}
.agenda-date {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 400;
  letter-spacing: -0.012em;
  font-variation-settings: "opsz" 60;
}
.agenda-meta {
  font-size: 11px; color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 500;
}
.agenda-section-label {
  padding: 16px 18px 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--ink-4);
  font-weight: 500;
  border-top: 1px dashed var(--rule-hair);
}
.agenda-section:first-of-type .agenda-section-label { border-top: 0; }

.agenda-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 18px;
  color: var(--ink);
  border-top: 1px solid var(--rule-hair);
  text-decoration: none;
  transition: background .15s ease;
}
.agenda-row:first-of-type { border-top: 0; }
.agenda-row:hover { background: rgba(14, 110, 124, 0.03); }
.agenda-row .time {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.4;
  padding-top: 2px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.agenda-row .time .ampm {
  color: var(--ink-3);
  font-weight: 400;
  margin-left: 1px;
}
.agenda-row .time .range {
  display: block;
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 400;
  margin-top: 2px;
  letter-spacing: 0.01em;
}
.agenda-row .content { min-width: 0; }
.agenda-row .title {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 400;
  letter-spacing: -0.014em;
  line-height: 1.25;
  margin: 0 0 4px;
  font-variation-settings: "opsz" 60;
}
.agenda-row .meta {
  font-size: 13px;
  color: var(--ink-3);
  line-height: 1.4;
}
.agenda-row .meta .tag {
  display: inline-flex; align-items: center; gap: 5px;
  margin-right: 8px;
}
.agenda-row .meta .tag .dot {
  width: 5px; height: 5px;
  border-radius: 50%; background: var(--accent);
}
.agenda-row .meta .tag.warm .dot { background: var(--warm); }
.agenda-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--rule-soft);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px;
  color: var(--ink-3);
  background: linear-gradient(0deg, rgba(247, 245, 239, 0.4) 0%, transparent 100%);
}

/* ─────────── sticky composer ─────────── */
.stuck-composer {
  position: fixed;
  bottom: 12px;
  left: 16px;
  right: 16px;
  max-width: 848px;
  margin: 0 auto;
  z-index: 5;
}
.stuck-composer .composer {
  display: flex; align-items: center; gap: 8px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 6px 6px 6px 18px;
  box-shadow:
    0 4px 16px -4px rgba(20, 20, 15, 0.16),
    0 1px 3px rgba(20, 20, 15, 0.04);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.stuck-composer .composer:focus-within {
  border-color: var(--accent);
  box-shadow:
    0 0 0 4px var(--accent-soft),
    0 4px 16px -4px rgba(20, 20, 15, 0.16);
}
.stuck-composer .composer input {
  flex: 1;
  border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 16px; color: var(--ink);
  padding: 10px 0;
  letter-spacing: -0.005em;
}
.stuck-composer .composer input::placeholder { color: var(--ink-3); }
.stuck-composer .composer .send {
  width: 36px; height: 36px;
  border: 0; border-radius: 999px;
  background: var(--ink); color: var(--paper);
  cursor: pointer; display: grid; place-items: center;
  transition: background .18s ease, transform .12s ease;
}
.stuck-composer .composer .send:hover { background: var(--accent); }
.stuck-composer .composer .send:active { transform: scale(0.95); }
.stuck-composer .composer .send svg { width: 14px; height: 14px; }
.stuck-composer .composer .send:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ─────────── desktop progressive enhancement ─────────── */
@media (min-width: 720px) {
  .page { padding: 24px 32px 140px; }
  .topbar { padding-bottom: 32px; }
  .turn-hava .voice { font-size: 22px; }
  .empty-state { padding: 80px 16px 40px; }

  .agenda-head { padding: 18px 24px; }
  .agenda-date { font-size: 22px; }
  .agenda-row {
    grid-template-columns: 92px 1fr auto;
    gap: 18px;
    padding: 14px 24px;
  }
  .agenda-row .time { font-size: 14px; }
  .agenda-row .time .range { font-size: 11.5px; }
  .agenda-row .title { font-size: 19px; }
  .agenda-row .meta { font-size: 13.5px; }
  .agenda-section-label { padding-left: 24px; padding-right: 24px; }
  .agenda-foot { padding: 14px 24px; }

  .stuck-composer .composer {
    padding: 8px 8px 8px 24px;
  }
  .stuck-composer .composer input {
    font-size: 17px;
    padding: 12px 0;
  }
  .stuck-composer .composer .send {
    width: 40px; height: 40px;
  }
  .stuck-composer .composer .send svg { width: 16px; height: 16px; }
}

/* ─────────── week_strip component (BUILD.md step 6) ─────────── */
.weekstrip {
  background: var(--paper);
  border: 1px solid var(--rule-hair);
  border-radius: 18px;
  box-shadow: 0 1px 2px rgba(20, 20, 15, 0.03), 0 12px 28px -20px rgba(20, 20, 15, 0.10);
  overflow: hidden;
}
.weekstrip-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule-soft);
  display: flex; align-items: baseline; justify-content: space-between;
  background: linear-gradient(180deg, rgba(247, 245, 239, 0.5) 0%, transparent 100%);
}
.weekstrip-head .title {
  font-family: var(--serif);
  font-size: 18px; font-weight: 400;
  letter-spacing: -0.012em;
  font-variation-settings: "opsz" 60;
}
.weekstrip-head .meta {
  font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: 0.16em; font-weight: 500;
}
.weekstrip-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 8px;
  gap: 2px;
}
.wsday {
  border: 0;
  background: transparent;
  border-radius: 12px;
  /* 44px+ tap target on mobile */
  padding: 10px 2px 10px;
  min-height: 64px;
  cursor: pointer;
  text-align: center;
  color: var(--ink);
  font-family: inherit;
  transition: background .15s ease;
}
.wsday:hover { background: rgba(20, 20, 15, 0.03); }
.wsday .dow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 500;
  margin-bottom: 4px;
}
.wsday .num {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
  margin-bottom: 6px;
}
.wsday .dots {
  display: flex; justify-content: center; gap: 2px; min-height: 4px;
  flex-wrap: wrap; max-width: 28px; margin: 0 auto;
}
.wsday .dots span {
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--ink-4);
}
.wsday .dots .more {
  width: auto; height: auto;
  background: transparent;
  font-size: 9px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: 0.04em;
  margin-left: 2px;
  line-height: 1;
}
.wsday.is-today .dow { color: var(--warm); }
.wsday.is-selected { background: var(--accent-soft); }
.wsday.is-selected .dow { color: var(--accent); }
.wsday.is-selected .num { color: var(--accent-deep); }
.wsday.is-selected .dots span { background: var(--accent); }

.weekstrip-content {
  border-top: 1px solid var(--rule-soft);
}
.weekstrip-content .agenda-row {
  padding: 11px 18px;
}
.weekstrip-content .agenda-empty {
  padding: 24px 18px;
  text-align: center;
  font-size: 14px;
  color: var(--ink-3);
  font-style: italic;
}
.weekstrip-foot {
  padding: 10px 18px 14px;
  text-align: center;
  border-top: 1px solid var(--rule-soft);
  font-size: 13px;
  color: var(--ink-3);
}
.weekstrip-foot a { color: var(--ink-2); }
.weekstrip-foot a:hover { color: var(--accent); }

/* ─────────── card_row component (BUILD.md step 6) ─────────── */
.cardrow {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
.mini-card {
  background: var(--paper);
  border: 1px solid var(--rule-hair);
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: var(--ink);
  display: flex; flex-direction: column;
  box-shadow: 0 1px 2px rgba(20, 20, 15, 0.03);
  transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s ease, border-color .25s ease;
}
.mini-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px -16px rgba(20, 20, 15, 0.16);
  border-color: var(--rule);
}
.mini-card .img {
  aspect-ratio: 16 / 10;
  background: linear-gradient(135deg, var(--bg-2), #e9e3d6);
  overflow: hidden;
  position: relative;
}
.mini-card .img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .5s ease;
}
.mini-card:hover .img img { transform: scale(1.04); }
.mini-card .body { padding: 14px 16px 16px; }
.mini-card .meta {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-3); font-weight: 500;
  margin-bottom: 6px;
  display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap;
}
.mini-card .meta .dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.mini-card .meta .dot.warm { background: var(--warm); }
.mini-card .name {
  font-family: var(--serif);
  font-size: 18px; font-weight: 400;
  letter-spacing: -0.014em;
  line-height: 1.2;
  margin: 0 0 4px;
  font-variation-settings: "opsz" 60;
}
.mini-card .blurb {
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.5;
  margin: 0;
}

@media (min-width: 720px) {
  .weekstrip-head { padding: 16px 24px; }
  .weekstrip-head .title { font-size: 19px; }
  .weekstrip-days { padding: 12px; gap: 4px; }
  .wsday {
    padding: 14px 4px 12px;
    min-height: 72px;
  }
  .wsday .dow { font-size: 10.5px; }
  .wsday .num { font-size: 22px; }
  .wsday .dots span { width: 4px; height: 4px; }
  .weekstrip-content .agenda-row { padding: 12px 24px; }
  .weekstrip-foot { padding: 12px 24px 16px; }

  .cardrow { grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mini-card .body { padding: 16px 18px 18px; }
  .mini-card .name { font-size: 19px; }
}

/* ─────────── single_card component (BUILD.md step 7) ─────────── */
.single-card {
  background: var(--paper);
  border: 1px solid var(--rule-hair);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(20, 20, 15, 0.03), 0 12px 28px -20px rgba(20, 20, 15, 0.10);
}
.single-card .img {
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, var(--bg-2), #e9e3d6);
  overflow: hidden;
  position: relative;
}
.single-card .img img { width: 100%; height: 100%; object-fit: cover; }
.single-card .body { padding: 16px 18px 18px; }
.single-card .meta-row {
  font-size: 11px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.single-card .meta-row .tag-dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.single-card .meta-row .tag-dot.warm { background: var(--warm); }
.single-card h3 {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 400;
  letter-spacing: -0.018em;
  line-height: 1.1;
  margin: 0 0 8px;
  font-variation-settings: "opsz" 60;
}
.single-card .summary {
  font-size: 14.5px;
  color: var(--ink-2);
  line-height: 1.55;
  margin: 0 0 14px;
}
.single-card .facts {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--rule-hair);
  border-bottom: 1px solid var(--rule-hair);
  margin-bottom: 14px;
}
.single-card .fact {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 12px;
  align-items: baseline;
  font-size: 13.5px;
}
.single-card .fact .key {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 10.5px;
  color: var(--ink-3);
  font-weight: 500;
}
.single-card .fact .val { color: var(--ink); }
.single-card .fact .val a { color: var(--accent); }
.single-card .actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.single-card .btn {
  flex: 1 1 auto;
  text-align: center;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: var(--paper);
  font-size: 13.5px;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: -0.005em;
  text-decoration: none;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.single-card .btn:hover {
  border-color: rgba(20, 20, 15, 0.22);

<div class="stuck-composer">

    <button id="composer-send" class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      </svg>

<!-- The full chat-new.js so renderers + dispatch are available -->
<script>// app/static/js/chat-new.js
//
// Hava — new /chat client (BUILD.md step 5).
//
// One file, no framework. Each turn is added to the thread. Hava's response
// has two parts: a voice line (1–3 sentences) and an optional component
// payload that the front-end renders by `component.type`.
//
// Component renderers live in this file as small functions. As new types
// land (week_strip, card_row, single_card, business_list), add a renderer
// in the COMPONENT_RENDERERS map below — the dispatch is one switch.

(function () {
  "use strict";

  // ─────────── session ───────────
  // Session ID survives back/forward but resets on hard reload. URL-bound
  // so /chat?q=foo always starts a fresh conversation, but submitting from
  // the same /chat keeps the same session.
  const url = new URL(window.location.href);
  const initialQuery = url.searchParams.get("q");
  const sessionId = makeSessionId();

  // ─────────── DOM refs ───────────
  const thread = document.getElementById("thread");
  const empty = document.getElementById("empty-state");
  const form = document.getElementById("composer-form");
  const input = document.getElementById("composer-input");
  const sendBtn = document.getElementById("composer-send");

  // ─────────── render helpers ───────────

  function makeSessionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s-" + Date.now() + "-" + Math.random().toString(36).slice(2);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // [name](url) markdown → safe <a>. Text outside links is escaped via
  // textContent. Only http(s) and root-relative URLs allowed.
  function renderVoiceWithLinks(text) {
    const fragment = document.createDocumentFragment();
    const re = /\[([^\]]+)\]\(([^)]+)\)/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) {
        fragment.appendChild(document.createTextNode(text.slice(last, m.index)));
      }
      const label = m[1];
      const href = m[2].trim();
      if (/^https?:\/\//i.test(href) || href.startsWith("/")) {
        const a = document.createElement("a");
        a.href = href;
        a.textContent = label;
        if (href.startsWith("http")) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        fragment.appendChild(a);
      } else {
        // Defensive: don't render unknown schemes.
        fragment.appendChild(document.createTextNode(m[0]));
      }
      last = re.lastIndex;
    }
    if (last < text.length) {
      fragment.appendChild(document.createTextNode(text.slice(last)));
    }
    return fragment;
  }

  function showEmptyState() {
    if (empty) empty.style.display = "";
  }
  function hideEmptyState() {
    if (empty) empty.style.display = "none";
  }

  function appendUserTurn(text) {
    hideEmptyState();
    const row = el("div", "turn-user");
    const bubble = el("div", "bubble");
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    scrollToBottom();
    return row;
  }

  function appendHavaTurn() {
    const row = el("div", "turn-hava is-loading");
    row.appendChild(el("span", "avatar"));
    const said = el("div", "said");
    const voice = el("p", "voice");
    voice.appendChild(typingDots());
    said.appendChild(voice);
    row.appendChild(said);
    thread.appendChild(row);
    scrollToBottom();
    return { row, said, voice };
  }

  function typingDots() {
    const wrap = el("span", "typing-dots");
    wrap.appendChild(el("span"));
    wrap.appendChild(el("span"));
    wrap.appendChild(el("span"));
    return wrap;
  }

  function fillHavaTurn(turn, payload) {
    turn.row.classList.remove("is-loading");
    turn.voice.textContent = "";
    turn.voice.appendChild(renderVoiceWithLinks(payload.voice || payload.response || ""));
    const slot = el("div", "component-slot");
    const renderer = COMPONENT_RENDERERS[payload.component && payload.component.type] || null;
    if (renderer) {
      const node = renderer(payload.component.data || {});
      if (node) slot.appendChild(node);
    }
    if (slot.childNodes.length > 0) {
      turn.said.appendChild(slot);
    }
    scrollToBottom();
  }

  function failHavaTurn(turn, message) {
    turn.row.classList.remove("is-loading");
    turn.row.classList.add("is-error");
    turn.voice.textContent = message;
    scrollToBottom();
  }

  function scrollToBottom() {
    // Smooth-scroll to keep the latest turn visible above the sticky
    // composer. Use requestAnimationFrame so layout has settled.
    requestAnimationFrame(() => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });
  }

  // ─────────── component renderers ───────────
  //
  // Each renderer takes the component's `data` and returns an HTMLElement
  // (or null to skip). Renderers are pure: no network, no side effects.

  function renderDayAgenda(data) {
    if (!data || !Array.isArray(data.events) || data.events.length === 0) {
      return null;
    }
    const root = el("div", "agenda");

    // Head
    const head = el("div", "agenda-head");
    const dateLabel = el("span", "agenda-date", data.date_label || formatDate(data.date));
    const meta = el("span", "agenda-meta");
    const count = data.events.length;
    meta.textContent = count === 1 ? "1 event" : count + " events";
    head.appendChild(dateLabel);
    head.appendChild(meta);
    root.appendChild(head);

    // Events grouped by morning / afternoon / evening if start_time present
    const grouped = groupByPartOfDay(data.events);
    for (const [label, events] of grouped) {
      if (events.length === 0) continue;
      const section = el("div", "agenda-section");
      section.appendChild(el("div", "agenda-section-label", label));
      events.forEach((ev) => section.appendChild(renderAgendaRow(ev)));
      root.appendChild(section);
    }

    // Foot
    const foot = el("div", "agenda-foot");
    foot.appendChild(el("span", null, "Showing " + count + " of " + count));
    root.appendChild(foot);

    return root;
  }

  function renderAgendaRow(ev) {
    const a = document.createElement("a");
    a.className = "agenda-row";
    a.href = ev.url || "#";

    const time = el("div", "time");
    const t = formatTime(ev.start);
    if (t) {
      const tn = document.createTextNode(t.hm);
      time.appendChild(tn);
      const ampm = el("span", "ampm", " " + t.ampm);
      time.appendChild(ampm);
    } else if (ev.time_label) {
      time.textContent = ev.time_label;
    }
    if (ev.end || ev.range_label) {
      const range = el("span", "range",
        ev.range_label || ("until " + (formatTime(ev.end) || {}).hm || ""));
      time.appendChild(range);
    }
    a.appendChild(time);

    const content = el("div", "content");
    content.appendChild(el("div", "title", ev.title || ""));
    const meta = el("div", "meta");
    if (ev.category) {
      const tag = el("span", "tag" + (ev.category_warm ? " warm" : ""));
      tag.appendChild(el("span", "dot"));
      tag.appendChild(document.createTextNode(ev.category));
      meta.appendChild(tag);
    }
    if (ev.venue) {
      meta.appendChild(document.createTextNode(ev.venue));
    }
    content.appendChild(meta);
    a.appendChild(content);

    return a;
  }

  function groupByPartOfDay(events) {
    const morning = [];
    const afternoon = [];
    const evening = [];
    const undated = [];
    for (const ev of events) {
      const t = formatTime(ev.start);
      if (!t) {
        undated.push(ev);
        continue;
      }
      const h = t.hour24;
      if (h < 12) morning.push(ev);
      else if (h < 17) afternoon.push(ev);
      else evening.push(ev);
    }
    const out = [];
    if (morning.length) out.push(["Morning", morning]);
    if (afternoon.length) out.push(["Afternoon", afternoon]);
    if (evening.length) out.push(["Evening", evening]);
    if (undated.length) out.push(["", undated]);
    return out;
  }

  function formatTime(s) {
    // Accepts "HH:MM" 24h or "HH:MM:SS"; returns {hm, ampm, hour24} or null
    if (!s || typeof s !== "string") return null;
    const m = /^(\d{1,2}):(\d{2})/.exec(s);
    if (!m) return null;
    const hour24 = parseInt(m[1], 10);
    const min = parseInt(m[2], 10);
    if (isNaN(hour24) || hour24 < 0 || hour24 > 23) return null;
    const ampm = hour24 < 12 ? "am" : "pm";
    const h12 = hour24 % 12 || 12;
    const hm = min === 0 ? String(h12) : h12 + ":" + String(min).padStart(2, "0");
    return { hm: hm, ampm: ampm, hour24: hour24 };
  }

  function formatDate(iso) {
    // "2026-05-08" → "Friday, May 8"
    if (!iso) return "";
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if (!m) return iso;
    const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }


  // ─────────── week_strip renderer (BUILD.md step 6) ───────────
  //
  // Schema (from BUILD.md):
  //   { days: [{ date, count, dow?, num?, is_today? }],
  //     selected_date, agenda: [<agenda_row items>] }
  //
  // Tap on a non-selected day fires a new chat query ("what's on Sat May 9?")
  // — fits the chat metaphor. The current turn's week_strip stays put.

  function renderWeekStrip(data) {
    if (!data || !Array.isArray(data.days) || data.days.length === 0) return null;
    const root = el("div", "weekstrip");

    // Head
    const head = el("div", "weekstrip-head");
    head.appendChild(el("span", "title", data.title || formatWeekRange(data.days)));
    if (typeof data.total_count === "number") {
      head.appendChild(
        el("span", "meta", data.total_count + (data.total_count === 1 ? " event" : " events"))
      );
    }
    root.appendChild(head);

    // Day picker
    const picker = el("div", "weekstrip-days");
    data.days.forEach((d) => picker.appendChild(renderWsDay(d, data.selected_date)));
    root.appendChild(picker);

    // Selected day's agenda
    const content = el("div", "weekstrip-content");
    if (Array.isArray(data.agenda) && data.agenda.length > 0) {
      data.agenda.forEach((ev) => content.appendChild(renderAgendaRow(ev)));
    } else {
      content.appendChild(el("div", "agenda-empty", "Nothing on this day yet."));
    }
    root.appendChild(content);

    // Foot — link to /chat for the full week, if provided
    if (data.foot_link) {
      const foot = el("div", "weekstrip-foot");
      const a = document.createElement("a");
      a.href = data.foot_link;
      a.textContent = data.foot_label || "Open the full calendar →";
      foot.appendChild(a);
      root.appendChild(foot);
    }
    return root;
  }

  function renderWsDay(d, selectedDate) {
    const btn = document.createElement("button");
    btn.className = "wsday";
    btn.type = "button";
    btn.dataset.date = d.date || "";
    if (d.is_today) btn.classList.add("is-today");
    if (d.date && d.date === selectedDate) btn.classList.add("is-selected");

    const dow = d.dow || dowFromIso(d.date);
    const num = d.num != null ? d.num : numFromIso(d.date);
    btn.appendChild(el("div", "dow", dow));
    btn.appendChild(el("div", "num", String(num)));

    // Dot indicator: cap at 6 + show "+N" beyond
    const dots = el("div", "dots");
    const count = Math.max(0, parseInt(d.count, 10) || 0);
    const visible = Math.min(count, 6);
    for (let i = 0; i < visible; i++) dots.appendChild(el("span"));
    if (count > visible) {
      const more = el("span", "more", "+" + (count - visible));
      dots.appendChild(more);
    }
    btn.appendChild(dots);

    btn.addEventListener("click", function () {
      // Tapping a day = ask Hava for that day. New turn, new component.
      const dayLabel = formatLongDate(d.date);
      submit("What's happening on " + dayLabel + "?");
    });
    return btn;
  }

  function dowFromIso(iso) {
    const d = isoToDate(iso);
    if (!d) return "";
    return d.toLocaleDateString("en-US", { weekday: "short" });
  }
  function numFromIso(iso) {
    const d = isoToDate(iso);
    return d ? d.getDate() : "";
  }
  function formatLongDate(iso) {
    const d = isoToDate(iso);
    if (!d) return iso || "";
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  function formatWeekRange(days) {
    if (!days || days.length === 0) return "";
    const a = isoToDate(days[0].date);
    const b = isoToDate(days[days.length - 1].date);
    if (!a || !b) return "";
    const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    return fmt(a) + " – " + fmt(b);
  }
  function isoToDate(iso) {
    if (!iso) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if (!m) return null;
    const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    return isNaN(d.getTime()) ? null : d;
  }

  // ─────────── card_row renderer (BUILD.md step 6) ───────────
  //
  // Schema: { items: [{ title, blurb, meta, image_url, url, category, category_warm? }] }

  function renderCardRow(data) {
    if (!data || !Array.isArray(data.items) || data.items.length === 0) return null;
    const root = el("div", "cardrow");
    data.items.forEach((it) => root.appendChild(renderMiniCard(it)));
    return root;
  }

  function renderMiniCard(it) {
    const a = document.createElement("a");
    a.className = "mini-card";
    a.href = it.url || "#";

    const img = el("div", "img");
    if (it.image_url) {
      const i = document.createElement("img");
      i.loading = "lazy";
      i.alt = it.image_alt || it.title || "";
      i.src = it.image_url;
      img.appendChild(i);
    }
    a.appendChild(img);

    const body = el("div", "body");
    const meta = el("div", "meta");
    if (it.category || it.meta) {
      const dot = el("span", "dot" + (it.category_warm ? " warm" : ""));
      meta.appendChild(dot);
      meta.appendChild(document.createTextNode(it.category || it.meta || ""));
    }
    body.appendChild(meta);
    body.appendChild(el("div", "name", it.title || ""));
    if (it.blurb) body.appendChild(el("p", "blurb", it.blurb));
    a.appendChild(body);

    return a;
  }


  // ─────────── single_card renderer (BUILD.md step 7) ───────────
  //
  // Schema: {
  //   title, image_url, image_alt, summary,
  //   category, category_warm?,
  //   facts: [{ key, val, val_url? }],
  //   actions: [{ label, url, primary? }],
  // }
  //
  // Use cases: a single venue lookup ("tell me about Channel Brewing"),
  // a single event ("when's the Bridgewater 5K"). For business lookups
  // with phone-tap and hours, use single_business_card (step 7.5).

  function renderSingleCard(data) {
    if (!data || !data.title) return null;
    const root = el("article", "single-card");

    // Image (skipped if no URL — placeholder gradient takes over)
    const img = el("div", "img");
    if (data.image_url) {
      const i = document.createElement("img");
      i.loading = "lazy";
      i.alt = data.image_alt || data.title;
      i.src = data.image_url;
      img.appendChild(i);
    }
    root.appendChild(img);

    const body = el("div", "body");

    // Meta row: category + optional status pill
    const metaRow = el("div", "meta-row");
    if (data.category) {
      metaRow.appendChild(el("span", "tag-dot" + (data.category_warm ? " warm" : "")));
      metaRow.appendChild(document.createTextNode(data.category));
    }
    if (data.status) {
      const status = el("span", "status " + (data.status_class || data.status));
      status.appendChild(el("span", "dot"));
      status.appendChild(document.createTextNode(data.status_text || data.status));
      metaRow.appendChild(status);
    }
    if (metaRow.childNodes.length > 0) body.appendChild(metaRow);

    body.appendChild(el("h3", null, data.title));
    if (data.summary) body.appendChild(el("p", "summary", data.summary));

    // Facts table — key/value rows
    if (Array.isArray(data.facts) && data.facts.length > 0) {
      const facts = el("div", "facts");
      data.facts.forEach((f) => {
        const row = el("div", "fact");
        row.appendChild(el("span", "key", f.key || ""));
        const val = el("span", "val");
        if (f.val_url) {
          const a = document.createElement("a");
          a.href = f.val_url;
          a.textContent = f.val || f.val_url;
          if (f.val_url.startsWith("http")) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
          val.appendChild(a);
        } else {
          val.textContent = f.val || "";
        }
        row.appendChild(val);
        facts.appendChild(row);
      });
      body.appendChild(facts);
    }

    // Actions row
    if (Array.isArray(data.actions) && data.actions.length > 0) {
      const actions = el("div", "actions");
      data.actions.forEach((a) => {
        const link = document.createElement("a");
        link.className = "btn" + (a.primary ? " primary" : "");
        link.href = a.url || "#";
        link.textContent = a.label || "View";
        if (a.url && a.url.startsWith("http")) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
        actions.appendChild(link);
      });
      body.appendChild(actions);
    }

    root.appendChild(body);
    return root;
  }


  // ─────────── business_list renderer (BUILD.md step 7.5) ───────────
  //
  // Schema: {
  //   category, total_count,
  //   items: [{
  //     name, thumb_url, category, rating, review_count,
  //     status, status_text, blurb,
  //     phone, phone_raw, address_short, url,
  //     spotlight: bool
  //   }],
  //   disclosure: bool        // show "Spotlight = paid placement" footer
  // }
  //
  // Spotlights are visually distinguished (warm-tinted row, "Spotlight" tag)
  // AND disclosed in the footer copy. Both surfaces are part of the design
  // contract — never silently re-rank by spotlight.

  function renderBusinessList(data) {
    if (!data || !Array.isArray(data.items) || data.items.length === 0) return null;
    const root = el("div", "biz-list");

    // Head: category + count
    const head = el("div", "biz-list-head");
    head.appendChild(el("span", "title", data.category || data.title || "Local pros"));
    if (typeof data.total_count === "number") {
      head.appendChild(
        el("span", "count", data.items.length + " of " + data.total_count)
      );
    }
    root.appendChild(head);

    // Rows
    let anySpotlight = false;
    data.items.forEach((it) => {
      if (it.spotlight) anySpotlight = true;
      root.appendChild(renderBizRow(it));
    });

    // Foot: disclosure (auto-show when any row is a spotlight, regardless
    // of the data.disclosure flag — trust depends on this) + count link
    const foot = el("div", "biz-list-foot");
    if (anySpotlight || data.disclosure) {
      foot.appendChild(el(
        "span", "disclosure",
        "Spotlight = paid placement. Hava's recommendations aren't pay-to-play."
      ));
    } else {
      foot.appendChild(document.createTextNode(""));
    }
    if (data.foot_link) {
      const a = document.createElement("a");
      a.href = data.foot_link;
      a.textContent = data.foot_label || "See all →";
      foot.appendChild(a);
    }
    root.appendChild(foot);

    return root;
  }

  function renderBizRow(it) {
    const a = document.createElement("a");
    a.className = "biz-row" + (it.spotlight ? " is-spotlight" : "");
    a.href = it.url || "#";

    // Thumbnail
    const thumb = el("div", "thumb");
    if (it.thumb_url || it.image_url) {
      const i = document.createElement("img");
      i.loading = "lazy";
      i.alt = it.name || "";
      i.src = it.thumb_url || it.image_url;
      thumb.appendChild(i);
    }
    a.appendChild(thumb);

    const body = el("div", "body");

    // Head line: name + Spotlight tag
    const headLine = el("div", "head-line");
    headLine.appendChild(el("h4", "name", it.name || ""));
    if (it.spotlight) {
      const tag = el("span", "spotlight-tag");
      tag.appendChild(el("span", "dot"));
      tag.appendChild(document.createTextNode("Spotlight"));
      headLine.appendChild(tag);
    }
    body.appendChild(headLine);

    // Meta line: category · rating · status pill
    const meta = el("div", "meta");
    if (it.category) meta.appendChild(el("span", "cat", it.category));
    if (typeof it.rating === "number") {
      meta.appendChild(el("span", "sep", "·"));
      const rating = el("span", "rating");
      const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      star.setAttribute("viewBox", "0 0 12 12");
      star.setAttribute("fill", "currentColor");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M6 1l1.5 3.5L11 5l-2.5 2.5L9 11 6 9.5 3 11l.5-3.5L1 5l3.5-.5z");
      star.appendChild(path);
      rating.appendChild(star);
      const reviewLabel = it.review_count != null ? " (" + it.review_count + ")" : "";
      rating.appendChild(document.createTextNode(it.rating.toFixed(1) + reviewLabel));
      meta.appendChild(rating);
    }
    if (it.status) {
      meta.appendChild(el("span", "sep", "·"));
      const status = el("span", "status " + (it.status_class || it.status));
      status.appendChild(el("span", "dot"));
      status.appendChild(document.createTextNode(it.status_text || it.status));
      meta.appendChild(status);
    }
    if (meta.childNodes.length > 0) body.appendChild(meta);

    // Blurb
    if (it.blurb) body.appendChild(el("p", "blurb", it.blurb));

    // Actions (Call + Directions when phone is present)
    if (it.phone || it.phone_raw || it.address_short) {
      const actions = el("div", "actions");
      if (it.phone_raw || it.phone) {
        const call = document.createElement("a");
        call.className = "btn primary";
        call.href = "tel:" + (it.phone_raw || it.phone.replace(/\D/g, ""));
        // Phone icon
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 16 16");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.5");
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", "M3 4c0 5 4 9 9 9l1-3-3-1-1 1c-2-1-3-2-4-4l1-1-1-3z");
        svg.appendChild(p);
        call.appendChild(svg);
        call.appendChild(document.createTextNode(
          " " + (it.phone ? "Call " + it.phone : "Call")
        ));
        // Stop the row anchor from intercepting the tel: tap
        call.addEventListener("click", function (e) { e.stopPropagation(); });
        actions.appendChild(call);
      }
      if (it.address_short || it.url) {
        const dir = document.createElement("a");
        dir.className = "btn";
        dir.href = it.directions_url || it.url || "#";
        dir.textContent = "Directions";
        dir.addEventListener("click", function (e) { e.stopPropagation(); });
        actions.appendChild(dir);
      }
      body.appendChild(actions);
    }

    a.appendChild(body);
    return a;
  }

  // ─────────── component dispatch ───────────
  // Add a key here when a new component type lands. Returning null falls
  // through to voice-only rendering.
  const COMPONENT_RENDERERS = {
    day_agenda: renderDayAgenda,
    week_strip: renderWeekStrip,
    card_row: renderCardRow,
    single_card: renderSingleCard,
    single_business_card: renderSingleCard,           // shares the single_card shape
    business_list: renderBusinessList,
    none: function () { return null; },
  };

  // ─────────── network ───────────

  async function postChat(query) {
    const turn = appendHavaTurn();
    sendBtn.disabled = true;
    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ query: query, session_id: sessionId }),
      });
      if (!resp.ok) {
        // Rate-limit returns 429 with a message string — surface plainly.
        let msg = "Something went sideways on my end. Try again in a sec.";
        try {
          const data = await resp.json();
          if (data && typeof data === "object" && data.detail) {
            msg = data.detail;
          }
        } catch (_) {
          // body wasn't JSON; keep default
        }
        failHavaTurn(turn, msg);
        return;
      }
      const payload = await resp.json();
      fillHavaTurn(turn, payload);
    } catch (e) {
      failHavaTurn(turn, "Couldn't reach me — check your connection and try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ─────────── form wiring ───────────

  function submit(query) {
    const q = (query || "").trim();
    if (!q) return;
    appendUserTurn(q);
    postChat(q);
    input.value = "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    submit(input.value);
  });

  // Chips (in the empty state) submit the chip text as a query.
  document.querySelectorAll(".chip[data-q]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      submit(btn.getAttribute("data-q"));
    });
  });

  // If the URL has ?q=…, fire it off on load.
  if (initialQuery && initialQuery.trim()) {
    submit(initialQuery);
  } else {
    showEmptyState();
  }
})();
</script>
