{% if snowbird_panel and snowbird_panel.entities %}
<section class="snowbird-panel" aria-label="Welcome back — recently reopened">
  <div class="snowbird-panel-head">
    <h2 class="snowbird-panel-title">Welcome back</h2>
    <p class="snowbird-panel-sub">These spots are open again for the season.</p>
  </div>
  <ul class="snowbird-panel-list">
    {% for ent in snowbird_panel.entities %}
    <li class="snowbird-panel-item">
      <a href="{{ ent.profile_url }}">{{ ent.name }}</a>
      {% if ent.status_copy %}
      <span class="snowbird-panel-status">{{ ent.status_copy }}</span>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
