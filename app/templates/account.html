{% extends "desert_base.html" %}
{% set active_tab = "saved" %}
{% block title %}Your account -- Ask Hava{% endblock %}
{% block head_extra %}<link rel="stylesheet" href="/static/styles/desert_account.css">{% endblock %}
{% block content %}
  <section class="d-util">
    <span class="d-eyebrow">My account</span>
    <h1>Signed <em>in.</em></h1>
    <p class="d-muted">Logged in as <strong>{{ user.email }}</strong>.</p>
    <div class="d-links-row">
      <a class="d-btn" href="/account/favorites">Saved listings</a>
      <a class="d-btn" href="/account/alerts">Alerts</a>
    </div>
    <form class="d-spaced" action="/logout" method="post">
      <button class="d-btn d-btn--solid" type="submit">Log out</button>
    </form>
  </section>
{% endblock %}
