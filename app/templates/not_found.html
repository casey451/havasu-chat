<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Not found — Hava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1620;
      --bg-card: #16212e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8efe6;
      --muted: #97a3a8;
      --accent: #7fd6c2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    main {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: 2.2rem;
      line-height: 1.2;
      margin: 0 0 16px;
      letter-spacing: -0.02em;
    }
    h1 em { font-style: italic; color: var(--accent); }
    p {
      color: var(--muted);
      line-height: 1.55;
      margin: 0 0 24px;
      font-size: 1.05rem;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    a.btn {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.btn-primary {
      background: var(--accent);
      color: #0e1620;
    }
    a.btn-primary:hover { transform: translateY(-1px); }
    a.btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    a.btn-ghost:hover { background: rgba(255, 255, 255, 0.04); }
  </style>
</head>
<body>
  <main>
    <div class="brand">Hava.</div>
    <h1>Not here. <em>Yet.</em></h1>
    <p>The page you're looking for moved, was removed, or never existed. Try the home page or ask Hava directly.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Hava</a>
      <a class="btn btn-ghost" href="/chat">Ask Hava</a>
    </div>
  </main>
</body>
</html>
