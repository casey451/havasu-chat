<!doctype html>
<html lang="en">
<head>
  {% include '_partials/plausible.html' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claims queue — Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #fafafa; color: #1a1a1a; }
    h1 { font-size: 1.25rem; }
    table { border-collapse: collapse; width: 100%; max-width: 960px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 0.5rem 0.65rem; text-align: left; vertical-align: top; font-size: 0.9rem; }
    th { background: #f0f0f0; }
    form.inline { display: inline-block; margin: 0.15rem 0.35rem 0 0; }
    button { cursor: pointer; padding: 0.25rem 0.5rem; }
    .reject-row textarea { width: 100%; min-height: 2.5rem; margin: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Pending claims</h1>
  {% if not claims %}
  <p>No pending claims.</p>
  {% else %}
  <table>
    <thead>
      <tr>
        <th>Claimant</th>
        <th>Listing</th>
        <th>Submitted</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for c in claims %}
      <tr>
        <td>{{ c.email }}</td>
        <td>{{ c.entity_name }}</td>
        <td>{{ c.claimed_at }}</td>
        <td>
          <form class="inline" method="post" action="/admin/claims/{{ c.id }}/verify">
            <select name="verification_method" required>
              {% for m in verification_methods %}
              <option value="{{ m }}">{{ m }}</option>
              {% endfor %}
            </select>
            <button type="submit">Verify</button>
          </form>
          <form class="inline reject-row" method="post" action="/admin/claims/{{ c.id }}/reject">
            <textarea name="rejection_reason" placeholder="Reason (required)" required></textarea>
            <button type="submit">Reject</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
  <p style="margin-top:1.5rem;"><a href="/admin">← Admin home</a></p>
</body>
</html>
