{# Shared desktop topbar (>=900px). One header pattern across every Lake Light
   page (DL-2). Search posts GET to /search?q= (DL-6 Wave 2); Ask Hava is the
   secondary CTA at /chat?q=. #}
<header class="ll-desktop-topbar" role="banner">
  <div class="ll-desktop-topbar-inner">
    <a href="/home" class="ll-wordmark ll-wordmark-dark">Ask <em>Hava</em></a>
    <form class="ll-desktop-search" action="/search" method="get" role="search" aria-label="Search Lake Havasu">
      <label class="visually-hidden" for="ll-desktop-q">Search Lake Havasu businesses and events</label>
      <input id="ll-desktop-q" type="text" name="q" placeholder="Search businesses and events">
      <button type="submit" aria-label="Submit search">-&gt;</button>
    </form>
    <a class="ll-desktop-ask-instead" href="/chat?q=">Ask Hava instead</a>
    <nav class="ll-desktop-links" aria-label="Primary desktop navigation">
      <a href="/events-ui">Events</a>
      <a href="/categories">Explore</a>
      <a href="/map">Map</a>
      <a href="/account/favorites">Saved</a>
      <a href="/login" class="ll-desktop-signin">Sign in</a>
    </nav>
  </div>
</header>
