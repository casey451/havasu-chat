<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Havasu Chat</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6f8;
      --user-bg: #0d6efd;
      --user-fg: #fff;
      --bot-bg: #e9ecef;
      --bot-fg: #212529;
      --border: #dee2e6;
      --radius: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: #212529;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
      min-height: 100dvh;
    }
    header {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #6c757d;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .row {
      display: flex;
      width: 100%;
    }
    .row.user { justify-content: flex-end; }
    .row.bot {
      justify-content: flex-start;
      flex-direction: column;
      align-items: flex-start;
    }
    .msg-feedback {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
      max-width: 100%;
    }
    .msg-feedback-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .thumb-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .thumb-btn:active {
      background: #e9ecef;
    }
    .thumb-btn.thumb-selected {
      background: var(--user-bg);
      color: var(--user-fg);
      border-color: var(--user-bg);
      pointer-events: none;
    }
    .thumb-btn.thumb-dim {
      opacity: 0.48;
      cursor: pointer;
    }
    .msg-feedback-err {
      display: none;
      font-size: 0.78rem;
      color: #842029;
      max-width: 220px;
      line-height: 1.35;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.user .bubble {
      background: var(--user-bg);
      color: var(--user-fg);
      border-bottom-right-radius: 6px;
    }
    .row.bot .bubble {
      background: var(--bot-bg);
      color: var(--bot-fg);
      border-bottom-left-radius: 6px;
    }
    .row.bot .bubble.loading {
      color: #6c757d;
      font-style: italic;
    }
    .catalog-link {
      text-align: center;
      font-size: 0.82rem;
      padding: 6px 16px 14px;
      color: #6c757d;
    }
    .catalog-link a {
      color: #0d6efd;
      font-weight: 600;
      text-decoration: none;
    }
    .site-footer {
      text-align: center;
      font-size: 0.78rem;
      padding: 0 16px calc(10px + env(safe-area-inset-bottom));
      color: #6c757d;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .site-footer a {
      color: #0d6efd;
      font-weight: 600;
      text-decoration: none;
    }
    .site-footer a:hover {
      text-decoration: underline;
    }
    .site-footer a + a {
      margin-left: 12px;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    #msg {
      flex: 1;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      font-size: 1rem;
      outline: none;
    }
    #msg:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }
    #send {
      min-width: 72px;
      min-height: 44px;
      padding: 0 16px;
      border: none;
      border-radius: 22px;
      background: var(--user-bg);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    #send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 12px;
      max-width: 100%;
    }
    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #212529;
      font-size: 0.88rem;
      line-height: 1.3;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      text-align: left;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active {
      background: #e9ecef;
    }
    .event-share-btn {
      margin-top: 12px;
      align-self: flex-start;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #495057;
      border-radius: 999px;
      padding: 10px 16px;
      min-height: 44px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .event-share-btn:active {
      background: #e9ecef;
    }
    /* Calendar button in header */
    header {
      position: relative;
    }
    .calendar-btn {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top));
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .calendar-btn:active {
      background: #e9ecef;
    }
    /* Calendar overlay */
    .calendar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: stretch;
      justify-content: center;
      z-index: 999;
      padding: 0;
    }
    .calendar-overlay.open {
      display: flex;
    }
    .calendar-shell {
      width: 100%;
      max-width: 600px;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .calendar-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .calendar-head h2 {
      flex: 1;
      margin: 0;
      font-size: 1.05rem;
      text-align: center;
    }
    .calendar-nav, .calendar-close {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 1.1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px 10px;
      color: #6c757d;
      font-size: 0.8rem;
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 0 10px 10px;
    }
    .cal-cell {
      min-height: 48px;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #fafafa;
      font-size: 0.95rem;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .cal-cell.empty { background: transparent; cursor: default; }
    .cal-cell.today { border-color: #0d6efd; font-weight: 700; }
    .cal-cell.has-events { background: #e7f1ff; color: #084298; font-weight: 600; }
    .cal-cell.has-events::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0d6efd;
    }
    .cal-cell.selected { border-color: #198754; background: #d1e7dd; }
    .calendar-day-detail {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      overflow-y: auto;
      flex: 1 1 auto;
      -webkit-overflow-scrolling: touch;
    }
    .calendar-day-detail h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }
    .cal-event {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cal-event:hover {
      background: #f8f9fa;
    }
    .cal-event:focus {
      outline: 2px solid #0d6efd;
      outline-offset: 2px;
    }
    .cal-event .title { font-weight: 600; }
    .cal-event .when { color: #495057; font-size: 0.88rem; margin-top: 2px; }
    .cal-event .where { color: #6c757d; font-size: 0.85rem; margin-top: 2px; }
    .cal-empty-day {
      color: #6c757d;
      font-size: 0.92rem;
      padding: 8px 4px;
    }
    .cal-loading {
      color: #6c757d;
      font-style: italic;
      padding: 8px 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Havasu Chat</h1>
      <p>Lake Havasu activities & events — search, browse, or share something new.</p>
      <button id="calendar-btn" class="calendar-btn" type="button" aria-label="Open calendar">📅</button>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <form class="composer" id="form">
      <input id="msg" type="text" autocomplete="off" placeholder="Message…" enterkeyhint="send" />
      <button type="submit" id="send">Send</button>
    </form>
    <p class="catalog-link"><a href="/contribute">Add to catalog →</a></p>
    <footer class="site-footer">
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
    </footer>
  </div>
  <div id="calendar-overlay" class="calendar-overlay" role="dialog" aria-modal="true" aria-label="Events calendar">
    <div class="calendar-shell">
      <div class="calendar-head">
        <button id="cal-prev" class="calendar-nav" type="button" aria-label="Previous month">‹</button>
        <h2 id="cal-title">—</h2>
        <button id="cal-next" class="calendar-nav" type="button" aria-label="Next month">›</button>
        <button id="cal-close" class="calendar-close" type="button" aria-label="Close calendar">✕</button>
      </div>
      <div class="calendar-weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="cal-grid" class="calendar-grid"></div>
      <div id="cal-day-detail" class="calendar-day-detail"></div>
    </div>
  </div>
  <script type="module" src="/static/js/calendar.js"></script>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
