  <div class="bulletin">
    <h2>Lake Mohave</h2>
    <p>Striped bass are biting on anchovies near the dam.</p>
    <h2>Lake Havasu</h2>
    <p>Largemouth and smallmouth bass fishing is good along the rocky points; water temperature is in the low 70s.</p>
    <p>Redear sunfish are active in the backwaters.</p>
    <h2>Colorado River below Davis Dam</h2>
    <p>Trout stocking continues weekly.</p>
