# Voice battery — 200 questions for grading Hava's chat responses.
# Companion: docs/voice-rubric.md (the rubric this is graded against).
# Runner: scripts/voice_battery/static_check.py
#
# Each question:
#   id              stable identifier
#   query           the user-facing prompt as typed in the chat composer
#   intent_shape    bucket for grouping (factual_phone, listing_business, etc.)
#   expected_tier   "1" | "2" | "3" | "gap_template" | "chat" | "placeholder"
#   must_contain    optional list of substrings the response MUST include
#   must_not_contain optional list of substrings the response MUST NOT include
#   notes           free-form rationale / what we're testing
#
# Provider names mix curated (CANONICAL_EXTRAS / Program providers) and Google places
# from the LHC pull. When a name might not exist locally, the grader treats it as a
# gap-response test.

