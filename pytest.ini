[pytest]
# Restrict default collection to tests/. Without this, a bare `pytest`
# invocation walks the whole working tree and picks up ad-hoc scratch
# files such as outputs/test_thread_a_diagnostic.py (a v43 FUSE-debug
# probe with no DB setup), producing spurious failures and adding
# minutes to the full-suite runtime. Production tests live under tests/;
# nothing outside that tree should be collected by default. Explicit
# `pytest path/...` still works.
testpaths = tests

markers =
    integration: optional tests that call real external APIs (run with: pytest -m integration)
