[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "scripts/output/",
    "scripts/fixtures/",
    "scripts/confabulation_eval_results/",
    "relay/",
    "alembic/versions/",
]

[tool.ruff.lint]
# Slice 39 (Path 1) shipped F,W. Slice 47 adds I (isort) — auto-fix-only,
# no judgment calls; CI fails on any future PR that touches imports
# without sorting. E rules deferred until Slice 49 closes E402 triage.
select = ["F", "I", "W"]

[tool.ruff.format]
# Reserved for future per-touch formatting; not enabled in CI.
quote-style = "double"
indent-style = "space"
