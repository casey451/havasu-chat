[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "scripts/output/",
    "scripts/fixtures/",
    "scripts/confabulation_eval_results/",
    "relay/",
    "alembic/versions/",
    # Cowork scratchpad: ad-hoc diagnostic scripts authored by Cowork
    # mid-session. Not production code, not in git, and shouldn't fail
    # `ruff check` locally even though CI never sees them (untracked).
    "outputs/",
    # One-off v27-era diagnostic at repo root; same rationale.
    "_v27_check.py",
]

[tool.ruff.lint]
# Slice 39 (Path 1) shipped F,W. Slice 47 added I (isort).
# Slice 49 adds E402 (module-import-not-at-top-of-file) after triage.
# Bucket A bootstrap-ordering files are exempt via per-file-ignores below
# (env-load or sys.path-insert must run before subsequent imports).
# Bucket C accidental late imports were moved to the top in the same slice.
# Other E rules (E501 line-length in particular) remain off; the
# project's line-length budget was never set and re-enabling E501
# would surface ~1352 cosmetic findings.
select = ["F", "I", "W", "E402"]

[tool.ruff.lint.isort]
# Pin `app` as first-party so ruff classifies it correctly even in
# environments where third-party deps (fastapi, etc.) aren't installed
# alongside ruff. Without this, CI's lint-only job (which installs only
# ruff) misclassifies `fastapi.testclient` as first-party and re-sorts
# `from app.* import ...` before it, producing spurious I001 errors on
# test files that import both. See CI run #449 for the original failure.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Slice 49: intentional bootstrap-ordering. Imports below the gate must
# stay in place because the gate (ensure_dotenv_loaded() or sys.path.insert)
# must run before the imports execute. Per-file-ignore over per-line noqa
# because the per-line form would push imports past line-length=100 and
# trigger I001 multi-line wrapping (cosmetic churn for no benefit).
"app/main.py" = ["E402"]                                          # ensure_dotenv_loaded() must run first
"scripts/analyze_chat_costs.py" = ["E402"]                        # sys.path.insert for python scripts/... invocation
"scripts/confabulation_eval.py" = ["E402"]                        # sys.path.insert for python scripts/... invocation
"scripts/extract_tier3_queries.py" = ["E402"]                     # sys.path.insert for python scripts/... invocation
"scripts/smoke_concurrent_chat.py" = ["E402"]                     # sys.path.insert for python scripts/... invocation
"scripts/cleanup/null_placeholder_phones.py" = ["E402"]           # sys.path.insert for python -m scripts.cleanup... invocation
"tests/test_classifier_hint_extraction_integration.py" = ["E402"] # sys.path.insert + ensure_dotenv_loaded() must run first

[tool.ruff.format]
# Reserved for future per-touch formatting; not enabled in CI.
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# pydantic.mypy only. The SQLAlchemy mypy plugin is legacy (supports the 1.x
# Mapped-via-plugin style and is unsupported past mypy ~1.10); our models use
# SQLAlchemy 2.0 native `Mapped[]` typing, which ships PEP-561 types and needs
# no plugin. Adding it under mypy 1.18 would error rather than help.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
# Permissive tree-wide so the gate is green on day one; ratchet per-module below.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = '(^|/)(alembic/versions|scripts/output|relay|outputs|\.venv)'

# TODO(typing): bootstrap baseline. On adoption these packages carried 180
# pre-existing type errors across 66 files. They are type-checked under the
# permissive config, but errors are suppressed so `mypy app` is green on day
# one. Ratchet a package OFF this list as it is typed: remove its entry, run
# `mypy app`, fix what surfaces, keep the gate green. New code should land
# clean — prefer adding modules out of this list over growing it.
[[tool.mypy.overrides]]
module = [
    "app.admin.*",
    "app.api.*",
    "app.categories.*",
    "app.chat.*",
    "app.conditions.*",
    "app.contrib.*",
    "app.core.*",
    "app.eval.*",
    "app.events.*",
    "app.groups.*",
    "app.home.*",
    "app.main",
    "app.providers.*",
    "app.search.*",
    "app.v1.*",
]
ignore_errors = true

# Ratchet strictness on the highest-value, most-typed packages first. This
# section is intentionally LAST and sets `ignore_errors = false` so its exact
# module entries override the `app.chat.*` suppression above and stay fully
# checked. T2.1 added the two highest-value chat hot-path modules
# (component_builders, unified_router) here — both already pass strict.
[[tool.mypy.overrides]]
module = [
    "app.db.*",
    "app.schemas.*",
    "app.chat.tier2_schema",
    "app.chat.component_builders",
    "app.chat.unified_router",
]
ignore_errors = false
disallow_untyped_defs = true
check_untyped_defs = true
