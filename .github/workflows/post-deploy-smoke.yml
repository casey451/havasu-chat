name: post-deploy-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx pyyaml -r requirements.txt
      - name: Wait for Railway deploy to settle
        run: sleep 60
      - name: Run post-deploy smoke
        run: python scripts/post_deploy_smoke.py --url https://havasu-chat-production.up.railway.app --json-out smoke_result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: smoke_result.json
