name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Slice 59 (Backlog #18 Phase D extension): cancel in-progress runs on the
# same ref when a new push arrives. Saves CI minutes when a slice's close-out
# sequence (substantive -> BACKLOG tick -> STATE close-out) triggers three
# runs in quick succession; only the latest matters for main's green-state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # OPS-10: read the prod pin so CI can't skew from the runtime again
          # (the #247 incident family — CI was green on 3.11 while prod ran 3.13).
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Install ruff
        run: python -m pip install -r dev-requirements.txt
      - name: ruff check
        run: python -m ruff check

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # OPS-10: read the prod pin so CI can't skew from the runtime again
          # (the #247 incident family — CI was green on 3.11 while prod ran 3.13).
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Install dependencies
        # mypy needs the real deps installed to resolve types, so install
        # requirements.txt as well as the dev tools (mypy + stub packages).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt
      - name: mypy
        run: python -m mypy app

  test:
    name: Test (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # OPS-10: read the prod pin so CI can't skew from the runtime again
          # (the #247 incident family — CI was green on 3.11 while prod ran 3.13).
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest
        env:
          # Test suite mocks API keys for unit tests; use a placeholder so
          # any accidental real-call attempt fails fast rather than billing.
          ANTHROPIC_API_KEY: test-placeholder-key
          OPENAI_API_KEY: test-placeholder-key
          # SQLite-backed local DB for tests.
          DATABASE_URL: sqlite:///./test.db
        # `-m "not integration"` excludes the OpenAI hint-extractor
        # integration tests in tests/test_classifier_hint_extraction_integration.py
        # — they hit the real API by design (per their docstring:
        # "Optional real OpenAI hint extraction (run: pytest -m integration)").
        # CI runs the unit suite only; integration tests are opt-in for
        # local runs against a real key.
        # `-n auto` runs the suite in parallel across CPU cores (pytest-xdist).
        # Enabled after the T2.4 test-isolation pass made it deterministic —
        # verified green across 6 local runs (4×`-n 4` + 2×`-n auto`), ~2× faster.
        run: python -m pytest -q -m "not integration" -n auto
