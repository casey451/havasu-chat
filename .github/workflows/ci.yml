name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ruff
        run: python -m pip install -r dev-requirements.txt
      - name: ruff check
        run: python -m ruff check

  test:
    name: Test (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest
        env:
          # Test suite mocks API keys; use a placeholder so any
          # accidental real-call attempt fails fast rather than billing.
          ANTHROPIC_API_KEY: test-placeholder-key
          OPENAI_API_KEY: test-placeholder-key
          # SQLite-backed local DB for tests.
          DATABASE_URL: sqlite:///./test.db
        run: python -m pytest -q
