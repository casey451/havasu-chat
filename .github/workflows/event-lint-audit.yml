name: event-lint-audit

# READ-ONLY event-quality lint (WS6 / §14.3). Runs app/events/lint over every
# live event and uploads a CSV of the flagged rows (AM/PM-flip candidates,
# venue-hours-as-event). scripts/event_lint_audit.py issues SELECTs only — it
# never writes the catalog. Exists because the repo .env DATABASE_URL is
# Railway's INTERNAL host, unreachable from a laptop; the audit runs here where
# the DB secret resolves. Download the artifact, review with Casey, then a gated
# reclassify/fix resolves the rows (never in CI).
#
# On-demand only (workflow_dispatch): a review tool, not a cron.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  event-lint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Event-quality lint (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/event_lint_audit.py --out events_lint_candidates.csv

      - name: Upload lint findings
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: event-lint-candidates
          path: events_lint_candidates.csv
          if-no-files-found: warn
