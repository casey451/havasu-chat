name: split-finger-typo-fix-apply

# Approval-gated, reversible fix of the "Stength" -> "Strength" typo on the live
# Split Finger rows (2026-07-15). Fenced like every prod-write op here:
#   * manual trigger only (workflow_dispatch)
#   * dry_run defaults TRUE: previews every row, writes nothing
#   * to apply: set dry_run=false AND type FIXTYPO in `confirm`
#   * runs in the `production-writes` Environment
#   * idempotent: only touches a row whose text still contains the typo
#   * writes + uploads an undo snapshot; restore locally with
#     `python scripts/fix_split_finger_title_typo_2026_07_15.py --undo-from undo.json --apply`

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no writes). Uncheck to apply.'
        type: boolean
        default: true
      confirm:
        description: 'Type FIXTYPO to apply (ignored on dry run)'
        required: false
        default: ''

concurrency:
  group: split-finger-typo-fix-apply
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-writes
    steps:
      - name: Guard — confirm phrase required to apply
        if: ${{ !inputs.dry_run && inputs.confirm != 'FIXTYPO' }}
        run: |
          echo "::error::apply requested but confirm was '${{ inputs.confirm }}', expected 'FIXTYPO'. Aborting before any write."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview fix (DRY RUN — no writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fix_split_finger_title_typo_2026_07_15.py

      - name: Apply fix (reversible) + write undo snapshot
        if: ${{ !inputs.dry_run && inputs.confirm == 'FIXTYPO' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/fix_split_finger_title_typo_2026_07_15.py \
            --apply --undo-json undo_sf_typo.json

      - name: Purge CDN cache after the write (no-op without CF creds)
        if: ${{ !inputs.dry_run && inputs.confirm == 'FIXTYPO' }}
        env:
          CF_PURGE_API_TOKEN: ${{ secrets.CF_PURGE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/purge_cdn_cache.py

      - name: Upload undo snapshot
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: split-finger-typo-undo
          path: undo_sf_typo.json
          if-no-files-found: warn
          retention-days: 180
