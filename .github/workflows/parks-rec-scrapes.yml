name: parks-rec-scrapes

on:
  # RESTORED 2026-05-13 (session-22): production deploy landed via d5e9b71;
  # all 6 migrations applied (alembic head now e1f2a3b4c5d6 on prod).
  # ORM-vs-prod-DB schema mismatch resolved; scraper can write entities
  # rows again. Cron resumed at the original cadence.
  schedule:
    # Unified scraper cadence (2026-06-06): every other day (odd days of the
    # month), staggered 10 min apart across the fleet. This slot = 6:10 AM
    # Arizona (MST/UTC-7, no DST). Month boundary (31st -> 1st) doubles up
    # once; all ingests are idempotent so the extra run is harmless.
    - cron: "10 13 1-31/2 * *"
  workflow_dispatch: {}

jobs:
  pull-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape (writes timestamped JSON to data/scrapes/)
        run: python scripts/run_scrapes.py

      - name: Load latest snapshots into the catalog
        env:
          # Railway Postgres connection string. Set in repo secrets:
          # GitHub repo → Settings → Secrets and variables → Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/parks_rec_load.py

      - name: Prune stale aquatic events
        # Hard-deletes Event rows whose source_url points at the aquatic
        # schedule page AND whose date is older than today - 7 days.
        # Same DATABASE_URL secret as the load step. See
        # app/contrib/parks_rec_loader.py :: prune_stale_aquatic.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/parks_rec_prune.py

      - name: Vision calendar/flyer ingest (lands PENDING for review)
        # Reads the Parks & Rec monthly calendar IMAGE + event-flyer images, and
        # the Senior Center flyer images, into events via a vision model. These
        # sources are NOT in the auto-approve registry, so every row lands as a
        # PENDING contribution for admin review -- nothing reaches users
        # unreviewed. Requires OPENAI_API_KEY in Actions secrets; with no key the
        # scrapers fetch 0 and ingest nothing (graceful no-op). continue-on-error
        # so a vision/API hiccup never fails the webtrac/aquatic load above.
        # The monthly image changes ~monthly, so the every-other-day cadence is
        # idempotent (synthetic per-occurrence URLs dedupe re-runs).
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/parks_rec_calendar_pull.py --apply \
            || echo "::warning::parks_rec_calendar ingest failed"
          python scripts/parks_rec_calendar_pull.py --source flyers --apply \
            || echo "::warning::parks_rec_flyers ingest failed"
          python scripts/senior_flyers_pull.py --apply \
            || echo "::warning::senior_center_flyers ingest failed"

      - name: Upload snapshots as a run artifact (audit trail)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scrape-snapshots-${{ github.run_id }}
          path: data/scrapes/
          retention-days: 14
