name: parks-rec-scrapes

on:
  # PAUSED 2026-05-12 (session-21): ORM-vs-prod-DB schema mismatch since
  # Phase 3.1 ship (session-20). Origin includes 7 new entity columns +
  # 5 new tables + users.preferred_mode that production Postgres (still
  # at alembic head b2c3d4e5f6a7) lacks. Every cron run fails with exit
  # code 1. Re-enable AFTER production deploy lands (6 migrations:
  # f8e9d0c1b2a3 -> 92ce4899dc08 -> c8d9e0f1a2b3 -> f9e8d7c6b5a4 ->
  # d0e1f2a3b4c5 -> e1f2a3b4c5d6) by uncommenting the schedule block.
  # See docs/SESSION_HANDOFF_2026-05-12_session21.md sec 2 for diagnosis.
  # schedule:
  #   # Every 6 hours, 15 minutes past the hour. Adjust as needed.
  #   - cron: "15 */6 * * *"
  workflow_dispatch: {}

jobs:
  pull-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape (writes timestamped JSON to data/scrapes/)
        run: python scripts/run_scrapes.py

      - name: Load latest snapshots into the catalog
        env:
          # Railway Postgres connection string. Set in repo secrets:
          # GitHub repo → Settings → Secrets and variables → Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/parks_rec_load.py

      - name: Prune stale aquatic events
        # Hard-deletes Event rows whose source_url points at the aquatic
        # schedule page AND whose date is older than today - 7 days.
        # Same DATABASE_URL secret as the load step. See
        # app/contrib/parks_rec_loader.py :: prune_stale_aquatic.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/parks_rec_prune.py

      - name: Upload snapshots as a run artifact (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-snapshots-${{ github.run_id }}
          path: data/scrapes/
          retention-days: 14
