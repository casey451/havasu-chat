name: post-deploy-verify

# After every push to main (main auto-deploys to Railway): (1) wait until the new
# build is actually live at the origin, (2) purge the Cloudflare edge cache so no
# PoP keeps a pre-deploy render, (3) run the cold-cache canary (bot UA, no cookies)
# which asserts each page's build-sha == the running app + render-ts is recent.
#
# This makes "verified live" AUTOMATIC and cold: a stale/edge render (the
# 2026-07-07 report) turns this red instead of going silently green. The purge is
# a no-op without CF creds; the canary still runs and still catches staleness.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: post-deploy-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Purge CDN once the deploy is live (no-op without CF creds)
        env:
          CF_PURGE_API_TOKEN: ${{ secrets.CF_PURGE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/purge_cdn_cache.py --verify-sha "${{ github.sha }}" --base https://askhava.com

      - name: Cold-cache canary (bot UA, no cookies) — build-sha + render-ts + date
        run: python scripts/freshness_canary.py --base https://askhava.com
