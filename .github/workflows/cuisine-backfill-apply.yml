name: cuisine-backfill-apply

# GATED apply of the operator-approved cuisine backfill (WS9a). Writes
# Provider.attributes['cuisine'] + pending_review for the rows in
# docs/audits/2026-07/cuisine_apply_approved_2026-07-08.csv, and uploads an undo
# CSV. Dry-run by default; the real write requires apply=true on dispatch (the
# dry-run -> Casey approves -> apply prod-data gate). Runs here because the repo
# .env points DATABASE_URL at Railway's internal host.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to WRITE (default false = dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cuisine-backfill-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply approved cuisines (dry-run unless apply=true)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/cuisine_backfill_apply.py --apply
          else
            python scripts/cuisine_backfill_apply.py
          fi

      - name: Upload undo CSV
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cuisine-backfill-apply-undo
          path: cuisine_backfill_apply_undo_2026-07-08.csv
          if-no-files-found: warn
