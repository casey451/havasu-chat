name: civic-events

# Pulls the high-trust civic / official event feeds into the catalog twice a week:
#   * legistar  — Lake Havasu City council / P&Z / board meetings (Legistar Web API)
#   * lhusd     — Lake Havasu Unified School District calendar (Apptegy iCal)
#
# Behavior: each scripts/<source>_pull.py --apply maps UPCOMING records to
# EventRecords and routes them through the shared ingestion path
# (app/contrib/event_ingest.ingest_event_records -> reconcile_event ->
# create_contribution -> approve). Both sources are in the auto-approve registry
# (civic/official, high trust), so complete upcoming events go LIVE; past events
# are dropped and ambiguous same-date/venue matches land pending. Re-runs merge
# (idempotent), so the cron never double-books.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch. This file must be merged to main before the cron takes effect.
# Until then, use the "Run workflow" button (workflow_dispatch) to trigger it.

on:
  schedule:
    # Tue / Fri at 14:15 UTC (= 7:15 AM Arizona, MST/UTC-7, no DST). Avoids the
    # parks-rec (:15 every 6h is 00/06/12/18), river-scene (:30), golakehavasu
    # (:45) and allevents (:00) windows on the same clock.
    - cron: "15 14 * * 2,5"
  workflow_dispatch: {}

jobs:
  pull-civic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull Legistar meetings (auto-approve, upcoming only)
        env:
          # Same Railway Postgres secret the other scrape crons use. Set in:
          # GitHub repo -> Settings -> Secrets and variables -> Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/legistar_pull.py --apply

      - name: Pull LHUSD calendar events (auto-approve, upcoming only)
        # Run even if the Legistar step failed, so one flaky feed can't block the
        # other; the next scheduled run recovers either way.
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/lhusd_pull.py --apply
