name: split-finger-apply

# Approval-gated, idempotent add of the Split Finger Athletics directory row
# (WS12 credential-checklist §2 — closes the /search?q=batting cages gap).
# Fenced like every prod-write op here:
#   * manual trigger only (workflow_dispatch) — never scheduled, never on push
#   * dry_run defaults TRUE: the first run previews the row and writes nothing
#   * to apply: set dry_run=false AND type CORRECT in `confirm`
#   * runs in the `production-writes` Environment
#   * the script is idempotent (no-ops if a Split Finger row already exists) and
#     prints the created id + slug on apply (undo = deactivate/delete that row)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no writes). Uncheck to apply.'
        type: boolean
        default: true
      confirm:
        description: 'Type CORRECT to apply (ignored on dry run)'
        required: false
        default: ''

concurrency:
  group: split-finger-apply
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-writes
    steps:
      - name: Guard — confirm phrase required to apply
        if: ${{ !inputs.dry_run && inputs.confirm != 'CORRECT' }}
        run: |
          echo "::error::apply requested but confirm was '${{ inputs.confirm }}', expected 'CORRECT'. Aborting before any write."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview the row (DRY RUN — no writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/add_split_finger_athletics.py

      - name: Apply (idempotent insert)
        if: ${{ !inputs.dry_run && inputs.confirm == 'CORRECT' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/add_split_finger_athletics.py --apply

      - name: Purge CDN cache after the write (no-op without CF creds)
        if: ${{ !inputs.dry_run && inputs.confirm == 'CORRECT' }}
        env:
          CF_PURGE_API_TOKEN: ${{ secrets.CF_PURGE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/purge_cdn_cache.py
