name: prelaunch-verify

# Nightly pre-launch deep event verification (Layers 1-3), READ-ONLY and DB-FREE.
# scripts/prelaunch_verify.py verifies the LIVE public site against authoritative
# sources entirely over cold HTTP — it never touches the database, so this job
# needs NO secrets. It re-fetches each in-window event's source (Layer 1), runs
# the full app.events.lint battery (Layer 2), and cold-curls the day / camps /
# night / movies pages asserting build-sha, links, times, venues and section
# counts (Layer 3). The job exits non-zero when the launch gate FAILS, so a
# regression turns the run red daily instead of surfacing at the next manual sweep.
#
# Artifacts (discrepancies.csv, render_digest.md, launch_gate.md) upload on every
# run — review them, then a Casey-approved GATED apply quarantines / fixes the
# rows (never in CI).
#
# NOTE: GitHub only runs scheduled workflows from the DEFAULT branch, so the cron
# does not fire until this file is merged to main. Until then, trigger it with the
# "Run workflow" button (workflow_dispatch).

on:
  schedule:
    # 16:30 UTC daily (= 09:30 AM Arizona, MST/UTC-7, no DST) — after the morning
    # event scrapes (13:30 / 13:45 UTC) so a same-day fix is reflected.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to verify"
        default: "https://askhava.com"
      days_source:
        description: "Layer 1+2 window (days)"
        default: "30"
      gate_days:
        description: "Launch-gate window (days)"
        default: "14"

permissions:
  contents: read

jobs:
  prelaunch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deep event verification (Layers 1-3, no DB)
        id: verify
        run: |
          python scripts/prelaunch_verify.py \
            --base-url "${BASE_URL:-https://askhava.com}" \
            --days-source "${DAYS_SOURCE:-30}" \
            --days-render 21 \
            --movies-days 7 \
            --gate-days "${GATE_DAYS:-14}" \
            --out-dir relay/prelaunch
        env:
          BASE_URL: ${{ inputs.base_url }}
          DAYS_SOURCE: ${{ inputs.days_source }}
          GATE_DAYS: ${{ inputs.gate_days }}

      - name: Publish launch-gate scorecard to the run summary
        if: always()
        run: |
          if [ -f relay/prelaunch/launch_gate.md ]; then
            cat relay/prelaunch/launch_gate.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: prelaunch-verify
          path: relay/prelaunch/
          if-no-files-found: warn
