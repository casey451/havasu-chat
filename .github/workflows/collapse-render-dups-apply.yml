name: collapse-render-dups-apply

# Approval-gated, reversible collapse of render-time display-duplicate events
# (scripts/collapse_render_dup_events.py — the generic re-runnable version of
# the 2026-07-05 op). Physically applies what the render dedup already hides:
# each (title, date) twin cluster keeps one survivor (absorbing flyer / richest
# text / real time / provenance) and losers flip to status='duplicate'. The
# script self-checks its reconstructed drop set against the render oracle and
# ABORTS on any mismatch before writing. Fenced like every prod-write op here:
#   * manual trigger only (workflow_dispatch) — never scheduled, never on push
#   * dry_run defaults TRUE: the first run previews every cluster, writes nothing
#   * to apply: set dry_run=false AND type COLLAPSE in `confirm`
#   * runs in the `production-writes` Environment
#   * apply writes a dated undo CSV (every survivor field change + loser flip)
#
# Reverse a run: download the undo artifact; the CSV lists every old value
# (kind,id,field,old_value) for a targeted restore.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no writes). Uncheck to apply.'
        type: boolean
        default: true
      confirm:
        description: 'Type COLLAPSE to apply (ignored on dry run)'
        required: false
        default: ''

concurrency:
  group: collapse-render-dups-apply
  cancel-in-progress: false

jobs:
  collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-writes
    steps:
      - name: Guard — confirm phrase required to apply
        if: ${{ !inputs.dry_run && inputs.confirm != 'COLLAPSE' }}
        run: |
          echo "::error::apply requested but confirm was '${{ inputs.confirm }}', expected 'COLLAPSE'. Aborting before any write."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview collapse (DRY RUN — no writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.collapse_render_dup_events

      - name: Apply collapse (reversible) + write undo CSV
        if: ${{ !inputs.dry_run && inputs.confirm == 'COLLAPSE' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.collapse_render_dup_events --apply

      - name: Purge CDN cache after the write (no-op without CF creds)
        if: ${{ !inputs.dry_run && inputs.confirm == 'COLLAPSE' }}
        env:
          CF_PURGE_API_TOKEN: ${{ secrets.CF_PURGE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/purge_cdn_cache.py

      - name: Upload undo CSV
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: collapse-render-dups-undo
          path: collapse_render_dup_events_undo_*.csv
          if-no-files-found: warn
          retention-days: 180
