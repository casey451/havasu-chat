name: cuisine-backfill-audit

# READ-ONLY WS9a cuisine backfill PROPOSAL report. Scans the Eat & Drink
# restaurants leaf, finds rows with no facet-visible cuisine, and proposes one
# into the fixed enum — deterministic (name/type/snippet keyword) first, sizing
# the LLM/Places remainder. scripts/cuisine_backfill_dryrun.py WRITES NOTHING
# (--apply hard-disabled); it issues SELECTs only. Runs here because the repo
# .env points DATABASE_URL at Railway's INTERNAL host, unreachable from a laptop.
# Download the artifact, review with Casey, THEN run the separate gated apply
# (writes attributes['cuisine'] via the WS6 review queue — never in this job).
#
# On-demand only (workflow_dispatch): a review tool, not a cron.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cuisine-backfill-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cuisine backfill proposal (read-only, never applies)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/cuisine_backfill_dryrun.py

      - name: Upload cuisine proposal report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cuisine-backfill-proposal
          path: docs/audits/2026-07/cuisine_backfill_dryrun_2026-07-08.csv
          if-no-files-found: warn
