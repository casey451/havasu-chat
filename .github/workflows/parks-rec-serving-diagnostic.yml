name: parks-rec-serving-diagnostic

# READ-ONLY diagnostic (workflow_dispatch only). Runs
# scripts/parks_rec_serving_diagnostic_2026_07_08.py against the DB the secret
# resolves (public proxy), to prove whether the "45 live P&R vs 32" discrepancy
# is a stale materialized snapshot layer (same DB) or split DBs. SELECTs only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Serving diagnostic (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is empty — refusing to run."
            exit 1
          fi
          python scripts/parks_rec_serving_diagnostic_2026_07_08.py
